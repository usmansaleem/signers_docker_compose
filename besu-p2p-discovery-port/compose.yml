# Test harness for besu-eth/besu PR #10718 (--p2p-discovery-port / --p2p-discovery-port-ipv6).
#
# Two standalone dual-stack nodes (no peering needed - we're only checking what each node
# advertises about itself):
#
#   besu-explicit  - TCP p2p ports differ from UDP discovery ports, all explicit:
#                     v4: tcp=30303 udp=30304        v6: tcp=30404 udp=30405
#   besu-ephemeral - TCP p2p ports fixed, UDP discovery ports set to 0 (OS-assigned ephemeral):
#                     v4: tcp=30313 udp=0(ephemeral)  v6: tcp=30414 udp=0(ephemeral)
#
# Expected (per PR description + EnodeURLImpl.getDiscPortQueryParam()):
#   - besu-explicit: enode includes "?discport=30304"; admin_nodeInfo ports.discovery=30304,
#     ports.discoveryV6=30405; enr's udp/udp6 fields decode to 30304/30405.
#   - besu-ephemeral: admin_nodeInfo ports.discovery / ports.discoveryV6 show whatever real
#     port the OS handed out (never 0, never the TCP port), and the enr/enode agree with it.
#
# Usage:
#   docker compose up
#   curl -s -XPOST -H 'content-type: application/json' \
#     --data '{"jsonrpc":"2.0","method":"admin_nodeInfo","params":[],"id":1}' \
#     http://localhost:18545 | jq
#   curl -s -XPOST -H 'content-type: application/json' \
#     --data '{"jsonrpc":"2.0","method":"admin_nodeInfo","params":[],"id":1}' \
#     http://localhost:18547 | jq

services:
  besu-explicit:
    image: hyperledger/besu:p2pdiscportdevelop
    container_name: besu-p2pdiscport-explicit
    networks:
      besu-net:
        ipv4_address: 172.30.0.10
        ipv6_address: fd00:beef:cafe::10
    ports:
      - "18545:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data-explicit:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./explicit.key:/opt/besu/node.key:ro
    command:
      - --network=ephemery
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-cors-origins=all
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - "--host-allowlist=*"
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - "--p2p-host=172.30.0.10"
      - "--p2p-host-ipv6=fd00:beef:cafe::10"
      - "--p2p-interface=0.0.0.0"
      - "--p2p-interface-ipv6=::"
      - --p2p-port=30303
      - --p2p-discovery-port=30304
      - --p2p-port-ipv6=30404
      - --p2p-discovery-port-ipv6=30405
      - --discovery-enabled=true
      - --bootnodes

  besu-ephemeral:
    image: hyperledger/besu:p2pdiscportdevelop
    container_name: besu-p2pdiscport-ephemeral
    networks:
      besu-net:
        ipv4_address: 172.30.0.20
        ipv6_address: fd00:beef:cafe::20
    ports:
      - "18547:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data-ephemeral:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./ephemeral.key:/opt/besu/node.key:ro
    command:
      - --network=ephemery
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-cors-origins=all
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - "--host-allowlist=*"
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - "--p2p-host=172.30.0.20"
      - "--p2p-host-ipv6=fd00:beef:cafe::20"
      - "--p2p-interface=0.0.0.0"
      - "--p2p-interface-ipv6=::"
      - --p2p-port=30313
      - --p2p-discovery-port=0
      - --p2p-port-ipv6=30414
      - --p2p-discovery-port-ipv6=0
      - --discovery-enabled=true
      - --bootnodes

networks:
  besu-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
        - subnet: fd00:beef:cafe::/64
          gateway: fd00:beef:cafe::1

volumes:
  besu-data-explicit:
  besu-data-ephemeral:
