# IPv6 auto-discovery test for PR #10416
#
# node1 (bootnode): dual-stack with --p2p-host (IPv4) and --p2p-host-ipv6 explicitly set.
#                   Advertises a complete dual-stack ENR.
# node2 (target):   dual-stack BIND (--p2p-interface-ipv6=::) but NO --p2p-host-ipv6.
#                   This is the scenario the PR is meant to fix: handler should auto-discover
#                   IPv6 from peer PONG reports and update ENR.
# node3 (witness):  dual-stack like node1; provides the second peer confirmation needed
#                   for DefaultExternalAddressSelector.MIN_CONFIRMATIONS=2.
#
# Expected per PR intent:
#   node2 receives ≥2 PONGs reporting its IPv6 as fd00:dead:beef::20,
#   IpV6NewAddressHandler fires, NodeRecordManager.updateAdvertisedIpv6Host writes new ENR,
#   admin_nodeInfo shows ip6/udp6/tcp6 fields populated, enr seq incremented.
#
# Expected per static analysis:
#   Handler fires but ipv6Endpoint=Optional.empty() inside NodeRecordManager
#   (because --p2p-host-ipv6 was not set). updateAdvertisedIpv6Host is silent no-op.
#   ENR remains IPv4-only.

services:
  besu-node1:
    image: hyperledger/besu:discv5develop
    container_name: besu-node1
    networks:
      besu-dual-net:
        ipv4_address: 172.28.0.10
        ipv6_address: fd00:dead:beef::10
    ports:
      - "30303:30303/tcp"
      - "30303:30303/udp"
      - "8545:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data1:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./node1.key:/opt/besu/node.key:ro
    command:
      - --network=dev
      - --rpc-http-cors-origins=all
      - "--host-allowlist=*"
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - "--p2p-host=172.28.0.10"
      - "--p2p-host-ipv6=fd00:dead:beef::10"
      - "--p2p-interface=0.0.0.0"
      - "--p2p-interface-ipv6=::"
      - --p2p-port=30303
      - --discovery-enabled=true
      - --bootnodes

  besu-node2:
    image: hyperledger/besu:discv5develop
    container_name: besu-node2
    depends_on:
      besu-node1:
        condition: service_healthy
    networks:
      besu-dual-net:
        ipv4_address: 172.28.0.20
        ipv6_address: fd00:dead:beef::20
    ports:
      - "30313:30303/tcp"
      - "30313:30303/udp"
      - "8547:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data2:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./node2.key:/opt/besu/node.key:ro
    # NOTE: dual-stack bind via --p2p-interface-ipv6, but NO --p2p-host-ipv6.
    # This is the auto-discovery scenario. --p2p-ipv6-outbound-enabled=true so node2's
    # outbound PINGs source from IPv6, letting peers PONG with its IPv6 source address.
    command:
      - --network=dev
      - --rpc-http-cors-origins=all
      - "--host-allowlist=*"
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - "--p2p-host=172.28.0.20"
      - "--p2p-interface=0.0.0.0"
      - "--p2p-interface-ipv6=::"
      - --p2p-port=30303
      - --p2p-ipv6-outbound-enabled=true
      - --discovery-enabled=true
      # node1's dual-stack ENR (deterministic from node1.key + compose config).
      # Carries ip/udp/tcp AND ip6/udp6/tcp6 so node2 can dial node1 over IPv6 from the first PING.
      - --bootnodes="enr:-Ly4QA41WvuyiN5RGymeFXe6lmKaOufW2IRRiCr8EQDCmDKGW3Ian0f5VHCUxU9i_rTx7BMc4n2Ev2kC8u7FxMsnMvkBg2V0aMfGhMXIWLWAgmlkgnY0gmlwhKwcAAqDaXA2kP0A3q2-7wAAAAAAAAAAABCJc2VjcDI1NmsxoQOxQXasSIFywVqmhA61NoVto58e_I-2fqLSQ1jTmS9wv4N0Y3CCdl-EdGNwNoJ2xIN1ZHCCdl-EdWRwNoJ2xA"

  besu-node3:
    image: hyperledger/besu:discv5develop
    container_name: besu-node3
    depends_on:
      besu-node1:
        condition: service_healthy
    networks:
      besu-dual-net:
        ipv4_address: 172.28.0.30
        ipv6_address: fd00:dead:beef::30
    ports:
      - "30323:30303/tcp"
      - "30323:30303/udp"
      - "8549:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data3:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./node3.key:/opt/besu/node.key:ro
    command:
      - --network=dev
      - --rpc-http-cors-origins=all
      - "--host-allowlist=*"
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - "--p2p-host=172.28.0.30"
      - "--p2p-host-ipv6=fd00:dead:beef::30"
      - "--p2p-interface=0.0.0.0"
      - "--p2p-interface-ipv6=::"
      - --p2p-port=30303
      - --discovery-enabled=true
      # node1's dual-stack ENR (deterministic from node1.key + compose config).
      # Carries ip/udp/tcp AND ip6/udp6/tcp6 so node2 can dial node1 over IPv6 from the first PING.
      - --bootnodes="enr:-Ly4QA41WvuyiN5RGymeFXe6lmKaOufW2IRRiCr8EQDCmDKGW3Ian0f5VHCUxU9i_rTx7BMc4n2Ev2kC8u7FxMsnMvkBg2V0aMfGhMXIWLWAgmlkgnY0gmlwhKwcAAqDaXA2kP0A3q2-7wAAAAAAAAAAABCJc2VjcDI1NmsxoQOxQXasSIFywVqmhA61NoVto58e_I-2fqLSQ1jTmS9wv4N0Y3CCdl-EdGNwNoJ2xIN1ZHCCdl-EdWRwNoJ2xA"

networks:
  besu-dual-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
        - subnet: fd00:dead:beef::/64
          gateway: fd00:dead:beef::1

volumes:
  besu-data1:
  besu-data2:
  besu-data3:
