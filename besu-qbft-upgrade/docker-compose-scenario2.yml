# Scenario 2: mixed 25.12.0 (legacy) + 26.6.0-develop (new, legacy-encoding=true)
#
# node-0, node-1 -> hyperledger/besu:26.6.0-develop  (fix branch, --Xbft-legacy-protocol-encoding=true)
# node-2, node-3 -> hyperledger/besu:25.12.0          (pre-blockAccessList legacy nodes)
#
# Validates that the new nodes can communicate with 25.12.0 nodes during a rolling upgrade.
# With --Xbft-legacy-protocol-encoding=true the new nodes emit the pre-26.1.0 wire format,
# so 25.x peers never see the BAL slot.
#
# Run ./setup.sh once to generate keys and genesis, then:
#   docker compose -f docker-compose-scenario2.yml up -d

x-besu-common: &besu-common
  volumes:
    - ./data/genesis.json:/opt/besu/genesis.json:ro
  networks:
    qbft-net:
  restart: "no"

services:
  node-0:
    <<: *besu-common
    image: hyperledger/besu:26.6.0-develop
    container_name: qbft-upgrade-node-0
    volumes:
      - ./data/genesis.json:/opt/besu/genesis.json:ro
      - ./data/node-0/key:/opt/besu/key:ro
    networks:
      qbft-net:
        ipv4_address: 172.30.0.10
    ports:
      - "8545:8545"
    command:
      - --data-path=/tmp/besu
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --p2p-host=172.30.0.10
      - --p2p-port=30303
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --host-allowlist=*
      - --min-gas-price=0
      - --Xbft-legacy-protocol-encoding=true
      - --logging=INFO

  node-1:
    <<: *besu-common
    image: hyperledger/besu:26.6.0-develop
    container_name: qbft-upgrade-node-1
    volumes:
      - ./data/genesis.json:/opt/besu/genesis.json:ro
      - ./data/node-1/key:/opt/besu/key:ro
    networks:
      qbft-net:
        ipv4_address: 172.30.0.11
    ports:
      - "8546:8545"
    depends_on:
      - node-0
    command:
      - --data-path=/tmp/besu
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --bootnodes=enode://${NODE0_PUBKEY}@172.30.0.10:30303
      - --p2p-host=172.30.0.11
      - --p2p-port=30303
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --host-allowlist=*
      - --min-gas-price=0
      - --Xbft-legacy-protocol-encoding=true
      - --logging=INFO

  node-2:
    <<: *besu-common
    image: hyperledger/besu:25.12.0
    container_name: qbft-upgrade-node-2
    volumes:
      - ./data/genesis.json:/opt/besu/genesis.json:ro
      - ./data/node-2/key:/opt/besu/key:ro
    networks:
      qbft-net:
        ipv4_address: 172.30.0.12
    ports:
      - "8547:8545"
    depends_on:
      - node-0
    command:
      - --data-path=/tmp/besu
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --bootnodes=enode://${NODE0_PUBKEY}@172.30.0.10:30303
      - --p2p-host=172.30.0.12
      - --p2p-port=30303
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --host-allowlist=*
      - --min-gas-price=0
      - --logging=INFO

  node-3:
    <<: *besu-common
    image: hyperledger/besu:25.12.0
    container_name: qbft-upgrade-node-3
    volumes:
      - ./data/genesis.json:/opt/besu/genesis.json:ro
      - ./data/node-3/key:/opt/besu/key:ro
    networks:
      qbft-net:
        ipv4_address: 172.30.0.13
    ports:
      - "8548:8545"
    depends_on:
      - node-0
    command:
      - --data-path=/tmp/besu
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --bootnodes=enode://${NODE0_PUBKEY}@172.30.0.10:30303
      - --p2p-host=172.30.0.13
      - --p2p-port=30303
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --host-allowlist=*
      - --min-gas-price=0
      - --logging=INFO

networks:
  qbft-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
