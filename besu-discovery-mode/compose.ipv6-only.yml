# Single-stack IPv6-only test: --p2p-interface=:: with NO --p2p-interface-ipv6/--p2p-host-ipv6
# (those flags are for the dual-stack *secondary* bind; here IPv6 is the *primary* and only
# stack, since no IPv4 subnet even exists on this docker network).
#
# --discovery-mode=V5 is required: BOTH/V4 need a real IPv4 socket
# (CompositePeerDiscoveryAgentFactory rejects them with a clear error otherwise).
#
# node1 (bootnode): IPv6-only, no bootnodes of its own.
# node2 (joiner):    IPv6-only, bootstraps via node1's (IPv6-only) ENR.
#
# Expected: both nodes log "Peer discovery mode: V5 (requested=V5, V4=false, V5=true)"; the
# local ENR has ip6/udp6/tcp6 fields only (no ip4/udp/tcp — confirm via admin_nodeInfo); node2
# bonds to node1 via DiscV5 and admin_peers on both nodes shows 1 connected peer.
#
# Usage:
#   docker compose -f compose.ipv6-only.yml up
#   curl -s -X POST -H "Content-Type: application/json" \
#     --data '{"jsonrpc":"2.0","method":"admin_nodeInfo","params":[],"id":1}' \
#     http://localhost:8590 | jq
#   docker compose -f compose.ipv6-only.yml down -v

services:
  besu-node1:
    image: hyperledger/besu:sharedtransport-develop
    container_name: discmode-v6only-node1
    networks:
      besu-v6only-net:
        ipv6_address: fd00:dead:beef::10
    ports:
      - "8590:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data1:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./node1.key:/opt/besu/node.key:ro
    # Uses built-in Dockerfile HEALTHCHECK: [ -f /tmp/pid ]
    command:
      - --network=dev
      - --rpc-http-cors-origins=all
      - "--host-allowlist=*"
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - --discovery-mode=V5
      - "--p2p-host=fd00:dead:beef::10"
      - "--p2p-interface=::"
      - --p2p-port=30303
      - --discovery-enabled=true
      - --bootnodes

  besu-node2:
    image: hyperledger/besu:sharedtransport-develop
    container_name: discmode-v6only-node2
    depends_on:
      besu-node1:
        condition: service_healthy
    networks:
      besu-v6only-net:
        ipv6_address: fd00:dead:beef::20
    ports:
      - "8591:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data2:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./node2.key:/opt/besu/node.key:ro
    command:
      - --network=dev
      - --rpc-http-cors-origins=all
      - "--host-allowlist=*"
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - --discovery-mode=V5
      - "--p2p-host=fd00:dead:beef::20"
      - "--p2p-interface=::"
      - --p2p-port=30303
      - --discovery-enabled=true
      # node1's IPv6-only ENR (ip6/udp6/tcp6 only, no ip4/udp/tcp) — deterministic from
      # node1.key + fd00:dead:beef::10 / port 30303 (verified against this exact image tag).
      - --bootnodes=enr:-Ka4QPjNrRWucw2jMqRJiGU_RpVHPIWUt15e3Tbk-GqHKfcYU_nBWdtNV88d-IlBQBPz4MQDl7MZA0s_UWqXLThG-N0Bg2V0aMfGhMXIWLWAgmlkgnY0g2lwNpD9AN6tvu8AAAAAAAAAAAAQiXNlY3AyNTZrMaEDsUF2rEiBcsFapoQOtTaFbaOfHvyPtn6i0kNY05kvcL-EdGNwNoJ2X4R1ZHA2gnZf

networks:
  besu-v6only-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: fd00:dead:beef::/64
          gateway: fd00:dead:beef::1

volumes:
  besu-data1:
  besu-data2:
