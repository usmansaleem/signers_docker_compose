# --discovery-mode=V5 end-to-end test, dual-stack (IPv4 + IPv6).
#
# node1 (bootnode): dual-stack, DiscV4 disabled entirely. No bootnodes of its own.
# node2 (joiner):    dual-stack, bootstraps via node1's ENR only (an enode:// bootnode
#                    would be useless here since DiscV4 never starts).
#
# Expected: both nodes log "Peer discovery mode: V5 (requested=V5, V4=false, V5=true)" and
# "Starting discovery on shared UDP socket (V5 only)"; node2 bonds to node1 via DiscV5 and
# admin_peers on both nodes shows 1 connected peer.
#
# Usage:
#   docker compose -f compose.v5-mode.yml up
#   curl -s -X POST -H "Content-Type: application/json" \
#     --data '{"jsonrpc":"2.0","method":"admin_peers","params":[],"id":1}' \
#     http://localhost:8570 | jq
#   docker compose -f compose.v5-mode.yml down -v

services:
  besu-node1:
    image: hyperledger/besu:sharedtransport-develop
    container_name: discmode-v5-node1
    networks:
      besu-dual-net:
        ipv4_address: 172.28.0.10
        ipv6_address: fd00:dead:beef::10
    ports:
      - "8570:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data1:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./node1.key:/opt/besu/node.key:ro
    # Uses built-in Dockerfile HEALTHCHECK: [ -f /tmp/pid ]
    command:
      - --network=dev
      - --rpc-http-cors-origins=all
      - "--host-allowlist=*"
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - --discovery-mode=V5
      - "--p2p-host=172.28.0.10"
      - "--p2p-host-ipv6=fd00:dead:beef::10"
      - "--p2p-interface=0.0.0.0"
      - "--p2p-interface-ipv6=::"
      - --p2p-port=30303
      - --discovery-enabled=true
      - --bootnodes

  besu-node2:
    image: hyperledger/besu:sharedtransport-develop
    container_name: discmode-v5-node2
    depends_on:
      besu-node1:
        condition: service_healthy
    networks:
      besu-dual-net:
        ipv4_address: 172.28.0.20
        ipv6_address: fd00:dead:beef::20
    ports:
      - "8571:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data2:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./node2.key:/opt/besu/node.key:ro
    command:
      - --network=dev
      - --rpc-http-cors-origins=all
      - "--host-allowlist=*"
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - --discovery-mode=V5
      - "--p2p-host=172.28.0.20"
      - "--p2p-host-ipv6=fd00:dead:beef::20"
      - "--p2p-interface=0.0.0.0"
      - "--p2p-interface-ipv6=::"
      - --p2p-port=30303
      - --discovery-enabled=true
      # node1's dual-stack ENR (DiscV5) — deterministic from node1.key +
      # 172.28.0.10 / fd00:dead:beef::10 / port 30303 (verified against this exact image tag).
      - --bootnodes=enr:-Ly4QA41WvuyiN5RGymeFXe6lmKaOufW2IRRiCr8EQDCmDKGW3Ian0f5VHCUxU9i_rTx7BMc4n2Ev2kC8u7FxMsnMvkBg2V0aMfGhMXIWLWAgmlkgnY0gmlwhKwcAAqDaXA2kP0A3q2-7wAAAAAAAAAAABCJc2VjcDI1NmsxoQOxQXasSIFywVqmhA61NoVto58e_I-2fqLSQ1jTmS9wv4N0Y3CCdl-EdGNwNoJ2xIN1ZHCCdl-EdWRwNoJ2xA

networks:
  besu-dual-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
        - subnet: fd00:dead:beef::/64
          gateway: fd00:dead:beef::1

volumes:
  besu-data1:
  besu-data2:
