# --discovery-mode=BOTH (default) end-to-end test, dual-stack (IPv4 + IPv6).
#
# node1 (bootnode): dual-stack, no bootnodes of its own. Advertises both an enode:// URL
#                    (DiscV4) and an ENR (DiscV5) — both point at the same physical node,
#                    since BOTH mode runs both protocols on the one shared UDP socket.
# node2 (joiner):    dual-stack, bootstraps via node1's enode AND ENR together, exercising
#                    both protocols bonding through the shared transport in the same run.
#
# Expected: node1 logs "Starting discovery on shared UDP socket (V4 + V5)"; node2 bonds to
# node1 via both DiscV4 and DiscV5 and admin_peers on both nodes shows 1 connected peer.
#
# Usage:
#   docker compose -f compose.both-mode.yml up
#   curl -s -X POST -H "Content-Type: application/json" \
#     --data '{"jsonrpc":"2.0","method":"admin_peers","params":[],"id":1}' \
#     http://localhost:8560 | jq
#   docker compose -f compose.both-mode.yml down -v

services:
  besu-node1:
    image: hyperledger/besu:sharedtransport-develop
    container_name: discmode-both-node1
    networks:
      besu-dual-net:
        ipv4_address: 172.28.0.10
        ipv6_address: fd00:dead:beef::10
    ports:
      - "8560:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data1:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./node1.key:/opt/besu/node.key:ro
    # Uses built-in Dockerfile HEALTHCHECK: [ -f /tmp/pid ]
    command:
      - --network=dev
      - --rpc-http-cors-origins=all
      - "--host-allowlist=*"
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - --discovery-mode=BOTH
      - "--p2p-host=172.28.0.10"
      - "--p2p-host-ipv6=fd00:dead:beef::10"
      - "--p2p-interface=0.0.0.0"
      - "--p2p-interface-ipv6=::"
      - --p2p-port=30303
      - --discovery-enabled=true
      - --bootnodes

  besu-node2:
    image: hyperledger/besu:sharedtransport-develop
    container_name: discmode-both-node2
    depends_on:
      besu-node1:
        condition: service_healthy
    networks:
      besu-dual-net:
        ipv4_address: 172.28.0.20
        ipv6_address: fd00:dead:beef::20
    ports:
      - "8561:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data2:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./node2.key:/opt/besu/node.key:ro
    command:
      - --network=dev
      - --rpc-http-cors-origins=all
      - "--host-allowlist=*"
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - --discovery-mode=BOTH
      - "--p2p-host=172.28.0.20"
      - "--p2p-host-ipv6=fd00:dead:beef::20"
      - "--p2p-interface=0.0.0.0"
      - "--p2p-interface-ipv6=::"
      - --p2p-port=30303
      - --discovery-enabled=true
      # node1's dual-stack enode (DiscV4) + ENR (DiscV5) — deterministic from node1.key +
      # 172.28.0.10 / fd00:dead:beef::10 / port 30303 (verified against this exact image tag).
      - --bootnodes=enode://b14176ac488172c15aa6840eb536856da39f1efc8fb67ea2d24358d3992f70bf64ee7b97443a63fb40e73aa72adb0c10d4483c82ea0f8a6c5c95cb4522c1d63d@172.28.0.10:30303,enr:-Ly4QA41WvuyiN5RGymeFXe6lmKaOufW2IRRiCr8EQDCmDKGW3Ian0f5VHCUxU9i_rTx7BMc4n2Ev2kC8u7FxMsnMvkBg2V0aMfGhMXIWLWAgmlkgnY0gmlwhKwcAAqDaXA2kP0A3q2-7wAAAAAAAAAAABCJc2VjcDI1NmsxoQOxQXasSIFywVqmhA61NoVto58e_I-2fqLSQ1jTmS9wv4N0Y3CCdl-EdGNwNoJ2xIN1ZHCCdl-EdWRwNoJ2xA

networks:
  besu-dual-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
        - subnet: fd00:dead:beef::/64
          gateway: fd00:dead:beef::1

volumes:
  besu-data1:
  besu-data2:
