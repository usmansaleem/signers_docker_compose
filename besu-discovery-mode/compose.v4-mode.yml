# --discovery-mode=V4 end-to-end test, dual-stack (IPv4 + IPv6).
#
# Exercises V4's new IPv6 dual-stack RLPx support: a V4-only node with
# --p2p-interface-ipv6/--p2p-host-ipv6 set now binds a second IPv6 RLPx TCP socket and
# advertises IPv6 ENR/enode fields, instead of those options being ignored with a warning.
#
# node1 (bootnode): dual-stack, DiscV5 disabled entirely. No bootnodes of its own.
# node2 (joiner):    dual-stack, bootstraps via node1's enode:// only (an ENR bootnode
#                    would be useless here since DiscV5 never starts).
#
# Expected: both nodes log "Peer discovery mode: V4 (requested=V4, V4=true, V5=false)" and
# "Starting discovery on shared UDP socket (V4 only)"; node2 bonds to node1 via DiscV4 and
# admin_peers on both nodes shows 1 connected peer. admin_nodeInfo's enodeV6/ip6 fields are
# populated on both nodes despite DiscV5 being disabled, confirming RLPx (not discovery) is
# what drives the IPv6 dual-stack socket in V4-only mode.
#
# Usage:
#   docker compose -f compose.v4-mode.yml up
#   curl -s -X POST -H "Content-Type: application/json" \
#     --data '{"jsonrpc":"2.0","method":"admin_nodeInfo","params":[],"id":1}' \
#     http://localhost:8580 | jq
#   docker compose -f compose.v4-mode.yml down -v

services:
  besu-node1:
    image: hyperledger/besu:sharedtransport-develop
    container_name: discmode-v4-node1
    networks:
      besu-dual-net:
        ipv4_address: 172.28.0.10
        ipv6_address: fd00:dead:beef::10
    ports:
      - "8580:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data1:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./node1.key:/opt/besu/node.key:ro
    # Uses built-in Dockerfile HEALTHCHECK: [ -f /tmp/pid ]
    command:
      - --network=dev
      - --rpc-http-cors-origins=all
      - "--host-allowlist=*"
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - --discovery-mode=V4
      - "--p2p-host=172.28.0.10"
      - "--p2p-host-ipv6=fd00:dead:beef::10"
      - "--p2p-interface=0.0.0.0"
      - "--p2p-interface-ipv6=::"
      - --p2p-port=30303
      - --discovery-enabled=true
      - --bootnodes

  besu-node2:
    image: hyperledger/besu:sharedtransport-develop
    container_name: discmode-v4-node2
    depends_on:
      besu-node1:
        condition: service_healthy
    networks:
      besu-dual-net:
        ipv4_address: 172.28.0.20
        ipv6_address: fd00:dead:beef::20
    ports:
      - "8581:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data2:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./node2.key:/opt/besu/node.key:ro
    command:
      - --network=dev
      - --rpc-http-cors-origins=all
      - "--host-allowlist=*"
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - --discovery-mode=V4
      - "--p2p-host=172.28.0.20"
      - "--p2p-host-ipv6=fd00:dead:beef::20"
      - "--p2p-interface=0.0.0.0"
      - "--p2p-interface-ipv6=::"
      - --p2p-port=30303
      - --discovery-enabled=true
      # node1's enode:// (DiscV4) — deterministic from node1.key + 172.28.0.10:30303
      # (verified against this exact image tag). The IPv6 RLPx socket comes from
      # --p2p-host-ipv6/--p2p-interface-ipv6 above, independent of discovery mode.
      - --bootnodes=enode://b14176ac488172c15aa6840eb536856da39f1efc8fb67ea2d24358d3992f70bf64ee7b97443a63fb40e73aa72adb0c10d4483c82ea0f8a6c5c95cb4522c1d63d@172.28.0.10:30303

networks:
  besu-dual-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
        - subnet: fd00:dead:beef::/64
          gateway: fd00:dead:beef::1

volumes:
  besu-data1:
  besu-data2:
