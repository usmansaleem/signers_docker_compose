# --p2p-port == --p2p-port-ipv6 end-to-end test, dual-stack (IPv4 + IPv6), discovery-mode=BOTH.
#
# Both nodes explicitly set --p2p-port-ipv6 to the SAME value as --p2p-port (30303), so
# operators can open a single firewall rule for both address families. Binding two
# independent per-family sockets on the same port reliably conflicts with a BindException on
# Linux regardless of bind order (see NetworkUtility.isMergeableDualStackBind) - this exercises
# the fix that merges this case into one dual-stack socket for both RLPx (TCP) and discovery
# (UDP V4+V5), instead of refusing to start.
#
# node1 (bootnode): dual-stack, same-port config, no bootnodes of its own. Advertises both an
#                    enode:// URL (DiscV4) and an ENR (DiscV5) - both point at the same physical
#                    node/port, since BOTH mode runs both protocols on the one shared UDP socket.
# node2 (joiner):    dual-stack, same-port config, bootstraps via node1's enode AND ENR together.
#
# Expected: node1 logs "P2P RLPx agent started and listening on ... (single dual-stack socket
# serving both IPv4 and IPv6)" and "Starting discovery on shared UDP socket (V4 + V5)" - no
# BindException on either node. node2 bonds to node1 via both DiscV4 and DiscV5 and admin_peers
# on both nodes shows 1 connected peer.
#
# Usage:
#   docker compose -f compose.same-port.yml up
#   curl -s -X POST -H "Content-Type: application/json" \
#     --data '{"jsonrpc":"2.0","method":"admin_peers","params":[],"id":1}' \
#     http://localhost:8610 | jq
#   docker compose -f compose.same-port.yml down -v

services:
  besu-node1:
    image: hyperledger/besu:sharedtransport-develop
    container_name: discmode-sameport-node1
    networks:
      besu-sameport-net:
        ipv4_address: 172.29.0.10
        ipv6_address: fd00:5a3e:beef::10
    ports:
      - "8610:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data1:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./node1.key:/opt/besu/node.key:ro
    # Uses built-in Dockerfile HEALTHCHECK: [ -f /tmp/pid ]
    command:
      - --network=dev
      - --rpc-http-cors-origins=all
      - "--host-allowlist=*"
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - --discovery-mode=BOTH
      - "--p2p-host=172.29.0.10"
      - "--p2p-host-ipv6=fd00:5a3e:beef::10"
      - "--p2p-interface=0.0.0.0"
      - "--p2p-interface-ipv6=::"
      - --p2p-port=30303
      - --p2p-port-ipv6=30303
      - --discovery-enabled=true
      - --bootnodes

  besu-node2:
    image: hyperledger/besu:sharedtransport-develop
    container_name: discmode-sameport-node2
    depends_on:
      besu-node1:
        condition: service_healthy
    networks:
      besu-sameport-net:
        ipv4_address: 172.29.0.20
        ipv6_address: fd00:5a3e:beef::20
    ports:
      - "8611:8545"
    environment:
      - LOG4J_CONFIGURATION_FILE=/var/lib/besu/custom-log4j.xml
    volumes:
      - besu-data2:/var/lib/besu
      - ./custom-log4j.xml:/var/lib/besu/custom-log4j.xml:ro
      - ./node2.key:/opt/besu/node.key:ro
    command:
      - --network=dev
      - --rpc-http-cors-origins=all
      - "--host-allowlist=*"
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
      - --data-path=/var/lib/besu
      - --node-private-key-file=/opt/besu/node.key
      - --discovery-mode=BOTH
      - "--p2p-host=172.29.0.20"
      - "--p2p-host-ipv6=fd00:5a3e:beef::20"
      - "--p2p-interface=0.0.0.0"
      - "--p2p-interface-ipv6=::"
      - --p2p-port=30303
      - --p2p-port-ipv6=30303
      - --discovery-enabled=true
      # node1's dual-stack enode (DiscV4) + ENR (DiscV5) - deterministic from node1.key +
      # 172.29.0.10 / fd00:5a3e:beef::10 / port 30303 (both families, same port) - verified
      # against this exact image tag.
      - --bootnodes=enode://b14176ac488172c15aa6840eb536856da39f1efc8fb67ea2d24358d3992f70bf64ee7b97443a63fb40e73aa72adb0c10d4483c82ea0f8a6c5c95cb4522c1d63d@172.29.0.10:30303,enr:-Ly4QDj-iguH0l2xceFvtpOTX4S0XFCfOtf_WXivikijpIpnX7UThJZNmyakEJAmGXO_XRbqG1hAtzaYcWLqIohXfeABg2V0aMfGhMXIWLWAgmlkgnY0gmlwhKwdAAqDaXA2kP0AWj6-7wAAAAAAAAAAABCJc2VjcDI1NmsxoQOxQXasSIFywVqmhA61NoVto58e_I-2fqLSQ1jTmS9wv4N0Y3CCdl-EdGNwNoJ2X4N1ZHCCdl-EdWRwNoJ2Xw

networks:
  besu-sameport-net:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.29.0.0/24
          gateway: 172.29.0.1
        - subnet: fd00:5a3e:beef::/64
          gateway: fd00:5a3e:beef::1

volumes:
  besu-data1:
  besu-data2:
